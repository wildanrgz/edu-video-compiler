claims:
  - id: c1
    text:
      id: "Ebbinghaus (1885) mengukur retensi pada dirinya sendiri dan menemukan penurunan tajam pada jam-jam pertama setelah belajar, bukan penurunan linear."
      en: "Ebbinghaus (1885) measured his own retention and found the drop is steepest in the first hours after learning, not linear over days."
    source:
      title: "Ebbinghaus, Memory: A Contribution to Experimental Psychology (1885)"
      url: "https://psychclassics.yorku.ca/Ebbinghaus/memory1.htm"
      published: "1885"
  - id: c2
    text:
      id: "Replikasi Murre & Dros (2015) menemukan pola lupa yang mirip, meski lebih lambat dari klaim Ebbinghaus dan sangat bervariasi antar individu."
      en: "Murre & Dros (2015) replicated the forgetting pattern, though slower than Ebbinghaus claimed and highly variable between individuals."
    source:
      title: "Murre & Dros, Replication and Analysis of Ebbinghaus' Forgetting Curve (PLOS ONE, 2015)"
      url: "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0120644"
      published: "2015-07-06"
  - id: c3
    text:
      id: "Roediger & Karpicke (2006) menunjukkan bahwa menguji diri (retrieval) menghasilkan retensi lebih baik daripada membaca ulang, walaupun peserta merasa membaca ulang lebih efektif."
      en: "Roediger & Karpicke (2006) showed that self-testing produces better retention than rereading, even though participants believed rereading worked better."
    source:
      title: "Roediger & Karpicke, Test-Enhanced Learning (Psychological Science, 2006)"
      url: "https://journals.sagepub.com/doi/10.1111/j.1467-9280.2006.01693.x"
      published: "2006-03"
  - id: c4
    text:
      id: "Meta-analisis Cepeda dkk. (2006) menemukan bahwa jeda antar sesi belajar (spacing) meningkatkan retensi dibandingkan belajar menumpuk dalam satu waktu."
      en: "Cepeda et al. (2006) found that spacing study sessions apart improves retention compared with massing them into one block."
    source:
      title: "Cepeda et al., Distributed practice in verbal recall tasks (Psychological Bulletin, 2006)"
      url: "https://doi.org/10.1037/0033-2909.132.3.354"
      published: "2006"

scenes:
  - id: s1
    purpose: hook
    script:
      id: "Kamu belajar tiga jam semalam. Pagi ini, setengahnya sudah hilang. Lalu kamu menyimpulkan salah satu dari dua hal: ingatanmu buruk, atau materinya terlalu sulit. Dua-duanya bukan penjelasan yang berguna. Yang sebenarnya terjadi jauh lebih bisa diatur daripada bakat, dan semuanya ditentukan oleh apa yang kamu lakukan setelah belajar."
      en: "You studied for three hours last night. This morning, half of it is gone. Then you conclude one of two things: your memory is bad, or the material is too hard. Neither is a useful explanation. What actually happened is far more controllable than talent, and all of it comes down to what you do after you study."
    on_screen:
      id: "Setengahnya hilang dalam semalam"
      en: "Half of it is gone by morning"
    points:
      id:
        - "3 jam belajar, hilang separuh dalam semalam"
        - "Bukan bakat, bukan tingkat kesulitan"
        - "Ditentukan oleh apa yang kamu lakukan setelahnya"
      en:
        - "3 hours of study, half gone overnight"
        - "Not talent, not difficulty"
        - "Decided by what you do afterwards"
    claim_ids: []
    asset_ids: []

  - id: s2
    purpose: context
    script:
      id: "Mulai dari apa yang sebenarnya disimpan otak. Ingatan bukan rekaman. Tidak ada file yang bisa diputar ulang dengan setia. Yang ada adalah jejak: pola koneksi yang dibentuk saat kamu belajar, dan setelah itu melemah kalau tidak pernah dipanggil. Ini bukan kerusakan, ini penghematan. Otak membuang jalur yang tidak pernah dipakai, karena menyimpan semuanya sama mahalnya dengan tidak menyimpan apa pun. Dan bagian yang menentukan: cara kamu memanggil jejak itu mengubah seberapa lama ia bertahan. Membaca ulang terasa seperti memanggil, padahal kamu hanya melihat jawabannya."
      en: "Start with what the brain actually stores. Memory is not a recording. There is no file that plays back faithfully. There are traces: patterns of connection built while you study, which weaken when they are never retrieved. That is not damage, it is housekeeping. The brain drops routes it never uses, because keeping everything costs as much as keeping nothing. And the part that decides the outcome: how you retrieve a trace changes how long it survives. Rereading feels like retrieval, but you are only looking at the answer."
    on_screen:
      id: "Ingatan = jejak, bukan file"
      en: "Memory = traces, not files"
    points:
      id:
        - "Bukan rekaman, tapi jejak koneksi"
        - "Jejak melemah kalau tidak dipanggil"
        - "Cara memanggil menentukan daya tahannya"
      en:
        - "Not a recording, a pattern of connections"
        - "Unused traces decay"
        - "How you retrieve sets how long it lasts"
    claim_ids: []
    asset_ids: []

  - id: s3
    purpose: evidence
    script:
      id: "Pada 1885, Ebbinghaus menghafal daftar suku kata tanpa arti, lalu menguji dirinya sendiri pada interval yang berbeda-beda. Hasilnya bukan garis lurus. Penurunan paling tajam terjadi di jam-jam pertama, lalu kurvanya mendatar. Murre dan Dros mengulang percobaan itu pada 2015 dengan data yang jauh lebih banyak, dan menemukan bentuk yang sama: tajam di awal, melambat kemudian. Bedanya, penurunannya lebih lambat dari klaim Ebbinghaus, dan sangat berbeda antar orang. Ada yang kehilangan setengah dalam hitungan jam, ada yang baru dalam beberapa hari. Jadi angka di layar itu bukan takdirmu. Yang penting adalah bentuk kurvanya, dan bentuk itu bisa diubah."
      en: "In 1885, Ebbinghaus memorised lists of nonsense syllables, then tested himself at different intervals. The result was not a straight line. The sharpest drop happened in the first hours, then the curve flattened out. Murre and Dros reran that experiment in 2015 with far more data and found the same shape: steep first, slow later. The difference is that their decline was slower than Ebbinghaus claimed, and it varied enormously between people. Some lose half within hours, some only after days. So the number on screen is not your fate. What matters is the shape of the curve, and that shape is changeable."
    on_screen:
      id: "Kurva lupa: tajam di awal"
      en: "The forgetting curve: steepest first"
    points:
      id:
        - "Ebbinghaus 1885: tajam di jam pertama, lalu mendatar"
        - "Murre & Dros 2015: bentuk sama, lebih lambat"
        - "Variasinya besar antar orang"
      en:
        - "Ebbinghaus 1885: steepest in the first hours"
        - "Murre & Dros 2015: same shape, slower decline"
        - "Huge variation between people"
    claim_ids: [c1, c2]
    asset_ids: [a1]

  - id: s4
    purpose: explain
    script:
      id: "Cara mengubah bentuk kurva itu ditemukan pada 2006 oleh Roediger dan Karpicke. Mereka membagi mahasiswa menjadi dua kelompok. Kelompok pertama membaca ulang teks sampai beberapa kali. Kelompok kedua membaca sekali, lalu menutup teks dan menuliskan semua yang bisa mereka ingat. Setelah itu semua diuji. Seminggu kemudian, kelompok yang menguji diri mengingat jauh lebih banyak, walaupun total waktu belajarnya sama. Dan bagian yang paling sering dilewatkan: kelompok pembaca ulang merasa lebih yakin akan hasilnya. Rasa yakin itu bukan retensi. Rasa yakin itu justru sinyal bahwa kamu belum menguji apa pun."
      en: "The way to change that curve was found in 2006 by Roediger and Karpicke. They split students into two groups. The first reread the text several times. The second read it once, then closed it and wrote down everything they could recall. Then everyone was tested. A week later, the self-testing group remembered substantially more, with the same total study time. And the part most people miss: the rereaders felt more confident about their results. That confidence is not retention. It is the signal that you have not tested anything yet."
    on_screen:
      id: "Baca ulang vs uji diri"
      en: "Rereading vs self-testing"
    points:
      id:
        - "Baca ulang 4x vs baca 1x lalu tulis dari ingatan"
        - "Seminggu kemudian: yang menguji diri menang"
        - "Pembaca ulang lebih yakin, tapi salah"
      en:
        - "Reread 4x vs read once, then recall in writing"
        - "A week later: the self-testers retained more"
        - "Rereaders felt more confident, and were wrong"
    claim_ids: [c3]
    asset_ids: [a2]

  - id: s5
    purpose: explain
    script:
      id: "Faktor kedua adalah jeda. Cepeda dan rekan-rekannya menggabungkan ratusan eksperimen pada 2006 dan menemukan pola yang konsisten: menyebar sesi belajar dalam beberapa hari mengalahkan menumpuk semuanya dalam satu malam, untuk jumlah menit yang persis sama. Mekanismenya sederhana dan sering disalahpahami. Kalau kamu memanggil kembali materi setelah agak lupa, usaha yang dibutuhkan lebih besar, dan usaha itulah yang memperkuat jejaknya. Kalau materinya masih segar, memanggilnya hampir gratis, dan hampir tidak mengubah apa pun. Jadi jeda bukan waktu istirahat dari belajar. Jeda itu bagian dari belajarnya."
      en: "The second factor is the gap. Cepeda and colleagues pooled hundreds of experiments in 2006 and found a consistent pattern: spreading study sessions over several days beats cramming them into one night, for exactly the same number of minutes. The mechanism is simple and widely misunderstood. When you retrieve material after partly forgetting it, the effort is larger, and that effort is what strengthens the trace. When the material is still fresh, retrieval is almost free, so it changes almost nothing. The gap is not a break from studying. The gap is part of the studying."
    on_screen:
      id: "Jeda mengalahkan tumpukan"
      en: "Spacing beats cramming"
    points:
      id:
        - "Menit sama, hasil beda: sebar vs tumpuk"
        - "Memanggil setelah agak lupa = usaha lebih besar"
        - "Usaha itulah yang memperkuat jejak"
      en:
        - "Same minutes, different result: spread vs mass"
        - "Retrieving after partial forgetting costs effort"
        - "That effort is what strengthens the trace"
    claim_ids: [c4]
    asset_ids: [a3]

  - id: s6
    purpose: counterpoint
    script:
      id: "Jadi kalau buktinya sudah jelas sejak 2006, kenapa semua orang masih membaca ulang? Karena menstabilo dan membaca ulang terasa enak. Materinya terasa lancar, dan kelancaran terasa seperti pemahaman. Psikolog menyebutnya ilusi kelancaran: kamu menilai keberhasilan belajar dari rasa mudah saat itu, bukan dari kemampuan menjawab besok. Dan penilaian itu salah secara sistematis, bukan acak. Ujian tidak peduli seberapa lancar halaman itu terasa saat kamu membacanya. Ujian menanyakan satu hal saja: bisakah kamu memproduksi jawabannya tanpa melihat."
      en: "So if the evidence has been clear since 2006, why does everyone still reread? Because highlighting and rereading feel good. The material feels smooth, and smoothness feels like understanding. Psychologists call it the fluency illusion: you judge learning by how easy it feels right now, not by whether you can answer tomorrow. And that judgement is wrong systematically, not randomly. An exam does not care how smooth the page felt while you read it. It asks one thing: can you produce the answer without looking."
    on_screen:
      id: "Familiar bukan berarti bisa"
      en: "Familiar is not recallable"
    points:
      id:
        - "Ilusi kelancaran: mudah dibaca bukan berarti tersimpan"
        - "Kamu menilai rasa saat itu, bukan kemampuan besok"
        - "Ujian menanyakan produksi, bukan pengenalan"
      en:
        - "Fluency illusion: easy to read is not stored"
        - "You judge the feeling now, not recall tomorrow"
        - "An exam tests production, not recognition"
    claim_ids: [c3]
    asset_ids: []

  - id: s7
    purpose: explain
    script:
      id: "Sekarang bagian yang bisa langsung dipakai, tanpa aplikasi apa pun. Setelah membaca satu bagian, tutup catatanmu. Tulis lima hal yang kamu ingat, dalam kalimatmu sendiri, bukan menyalin kalimat di buku. Lalu buka catatan dan tandai yang salah atau yang terlewat. Yang terlewat itu daftar belajar yang sebenarnya, bukan yang kamu rencanakan. Besok, ulangi tanpa melihat. Tiga hari kemudian, ulangi lagi, dan hanya uji yang masih salah. Total tambahan waktunya sekitar sepuluh menit per sesi, dan itu menggantikan jam membaca ulang, bukan menambahnya."
      en: "Now the part you can use tonight, without any app. After you read one section, close your notes. Write five things you remember, in your own sentences, not copied from the page. Then open the notes and mark what was wrong or missing. What was missing is your real study list, not the one you planned. Tomorrow, repeat it without looking. Three days later, repeat again, and only test what is still wrong. The extra time is about ten minutes per session, and it replaces rereading hours, it does not add to them."
    on_screen:
      id: "Protokol: tutup, tulis, cek"
      en: "Protocol: close, write, check"
    points:
      id:
        - "Tutup catatan, tulis 5 hal dari ingatan"
        - "Yang terlewat = daftar belajar sebenarnya"
        - "Ulangi besok dan tiga hari lagi"
      en:
        - "Close notes, write 5 things from memory"
        - "What you missed is the real study list"
        - "Repeat tomorrow, then in three days"
    claim_ids: []
    asset_ids: []

  - id: s8
    purpose: explain
    script:
      id: "Contoh konkret, misalnya ujianmu tanggal dua puluh. Hari ini: baca satu bab, tutup, tulis lima poin. Besok: uji lima poin itu, lalu tambah lima poin baru dari bagian berikutnya. Tiga hari kemudian: uji semuanya, dan habiskan waktumu hanya pada yang salah. Seminggu sebelum ujian: tidak ada membaca ulang dari awal, hanya uji diri campuran, karena ujian sebenarnya juga mencampur semua bab. Dan kalau satu poin selalu salah, itu bukan tanda kamu bodoh. Itu tanda cara menyimpannya belum tepat: ubah kalimatnya menjadi pertanyaan, lalu jawab pertanyaan itu besok."
      en: "A concrete example, say your exam is on the twentieth. Today: read one chapter, close it, write five points. Tomorrow: test those five, then add five new ones from the next section. Three days later: test everything and spend your time only on what was wrong. A week before the exam: no rereading from the top, only mixed self-testing, because the real exam mixes chapters too. And if one point is always wrong, that is not a sign you are stupid. It is a sign it was stored badly: turn the sentence into a question, then answer that question tomorrow."
    on_screen:
      id: "Jadwal kerja untuk satu ujian"
      en: "A working schedule for one exam"
    points:
      id:
        - "Hari 1: baca, tutup, tulis 5 poin"
        - "Hari 2: uji 5 poin, tambah 5 baru"
        - "Hari 4 dan H-7: uji campuran, bukan baca ulang"
      en:
        - "Day 1: read, close, write 5 points"
        - "Day 2: test 5, add 5 new"
        - "Day 4 and final week: mixed tests, no rereading"
    claim_ids: []
    asset_ids: []

  - id: s9
    purpose: takeaway
    script:
      id: "Ringkasnya empat kalimat. Lupa itu normal, dan bentuk kurvanya bisa diubah. Membaca ulang terasa produktif, tapi menguji diri yang benar-benar menyimpan. Jeda mengalahkan tumpukan, untuk jumlah menit yang sama. Dan rasa familiar bukan bukti bahwa kamu bisa. Kalau kamu hanya mengubah satu hal minggu ini, tutup catatan sepuluh menit sebelum selesai belajar. Episode berikutnya membahas cara memilih panjang jeda yang tepat kalau ujianmu sudah punya tanggal tetap."
      en: "Four sentences to take away. Forgetting is normal, and the shape of the curve can be changed. Rereading feels productive, but self-testing is what stores. Spacing beats cramming, for the same number of minutes. And familiarity is not proof that you can recall. If you change one thing this week, close your notes ten minutes before you finish studying. The next episode covers how to pick the right gap when your exam already has a fixed date."
    on_screen:
      id: "Tutup catatan. Tulis. Ulangi besok."
      en: "Close notes. Write. Repeat tomorrow."
    points:
      id:
        - "Lupa normal, kurvanya bisa diubah"
        - "Uji diri menyimpan, baca ulang tidak"
        - "Jeda mengalahkan tumpukan, menit sama"
      en:
        - "Forgetting is normal, the curve is changeable"
        - "Self-testing stores, rereading does not"
        - "Spacing beats cramming, same minutes"
    claim_ids: []
    asset_ids: []

