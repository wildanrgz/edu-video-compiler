slug: why-you-forget
# draft: demo/fixture. Narasinya ~2 menit, jadi gate 4 menit hanya memberi warning.
status: draft

title:
  id: "Kenapa kamu lupa hal yang baru kamu pelajari"
  en: "Why you forget what you just learned"

thesis:
  id: "Lupa bukan bukti kamu lambat: membaca ulang terasa produktif tapi hanya menguji pengenalan, sedangkan mengambil kembali informasi dari ingatan tanpa melihat catatan itulah yang benar-benar menyimpannya."
  en: "Forgetting is not proof you are slow: rereading feels productive but only tests recognition, while retrieving the answer from memory without looking is what actually stores it."

thesis_keywords:
  - forgetting-curve
  - retrieval-practice
  - spaced-repetition
  - study-method
  - memory-retention
  - rereading-myth

audience:
  id: "Pelajar dan pekerja yang sudah punya jam belajar tapi hasilnya tidak menempel"
  en: "Students and working adults who already put in the hours but still cannot retain what they studied"

