name: lockfile

# Regenerates package-lock.json from the exact versions pinned in package.json and
# commits it. Run this after changing a dependency; CI uses `npm ci`, which needs it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from pinned versions
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package-lock.json from pinned versions"
          git push
